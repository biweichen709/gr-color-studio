name: Build Windows exe

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Unit and GUI tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build exe
        run: python packaging/build.py

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GRColorStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:TEMP\GRColorStudio-error.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "selftest passed, size: $((Get-Item dist\GRColorStudio.exe).Length) bytes"

      - name: Assemble download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\GRColorStudio.exe release\
          Copy-Item packaging\*.txt release\
          Compress-Archive -Path release\* -DestinationPath GRColorStudio-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GRColorStudio-windows-x64
          path: release/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GR Color Studio · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows 10/11 64 位，下载 `GRColorStudio.exe` 双击运行；`GRColorStudio-windows-x64.zip` 内附使用说明。
            程序未做代码签名，首次运行在 SmartScreen 提示中选择「更多信息 → 仍要运行」。
          files: |
            release/GRColorStudio.exe
            GRColorStudio-windows-x64.zip
